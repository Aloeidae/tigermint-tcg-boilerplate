<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tigermint TCG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Telegram Mini App bridge: defines window.Telegram.WebApp only inside
         the Telegram webview; harmless everywhere else (see src/tma.ts). -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      /*
       * DOM overlay skin. These variables + src/theme.ts are the entire look
       * of the game: change the tokens here for the menu, theme.ts for the
       * canvas, and the fonts <link> above if you swap font families.
       */
      :root {
        --font-display: 'Lilita One', 'Arial Black', sans-serif;
        --font-body: 'Inter', Verdana, sans-serif;
        --font-mono: 'JetBrains Mono', Consolas, monospace;

        --bg: #000000;
        --panel: rgba(13, 13, 13, 0.92);
        --surface: #161616;
        --border: rgba(255, 255, 255, 0.1);

        --accent: #f97316;
        --accent-hover: #fb923c;
        --accent-press: #ea580c;
        --accent-soft: rgba(249, 115, 22, 0.3);
        --accent-glow: 0 10px 30px -10px rgba(249, 115, 22, 0.6);
        --panel-glow: 0 20px 60px -15px rgba(249, 115, 22, 0.35);

        --text: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.52);
        --text-faint: rgba(255, 255, 255, 0.4);
        --error: #f87171;
        --on-accent: #000000;

        --radius-sm: 8px;
        --radius-lg: 12px;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        font-family: var(--font-body);
      }
      #game { position: absolute; inset: 0; }
      #game canvas { display: block; margin: 0 auto; }

      /* --- DOM overlay: menu + TonConnect --- */
      #menu {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        pointer-events: none;
        z-index: 10;
        transition: opacity 0.25s var(--ease);
      }
      #menu.reveal-active { opacity: 0; }
      #menu.reveal-active > * { pointer-events: none !important; }
      #menu > * { pointer-events: auto; }
      #menu-row {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        margin-top: 12vh;
        pointer-events: none;
      }
      #menu-row > * { pointer-events: auto; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: var(--panel-glow), 0 24px 60px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(6px);
        border-radius: var(--radius-lg);
        padding: 26px 34px;
        width: 420px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: stretch;
        transition: border-color 0.2s var(--ease);
      }
      .panel:hover { border-color: var(--accent-soft); }
      #top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      #top-bar .menu-btn { font-size: 13px; padding: 9px 16px; }
      #ton-connect { display: flex; justify-content: center; min-height: 40px; }
      #deck-status {
        color: var(--text-muted);
        font-size: 13px;
        text-align: center;
        line-height: 1.5;
        min-height: 32px;
      }
      #rules-preset {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 14px;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        transition: border-color 0.15s ease;
      }
      #rules-preset:hover { border-color: var(--accent); }
      #rules-desc {
        color: var(--text-faint);
        font-size: 12px;
        text-align: center;
        line-height: 1.4;
        min-height: 28px;
      }
      button.menu-btn {
        font-family: var(--font-display);
        font-size: 17px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 13px;
        border-radius: var(--radius-sm);
        border: 1px solid #000;
        cursor: pointer;
        background: var(--accent);
        color: var(--on-accent);
        box-shadow: var(--accent-glow);
        transition: background 0.15s var(--ease), box-shadow 0.15s var(--ease);
      }
      button.menu-btn:hover { background: var(--accent-hover); }
      button.menu-btn:active { background: var(--accent-press); }
      button.menu-btn.secondary {
        background: transparent;
        border: 1px solid var(--accent-soft);
        color: var(--text);
        box-shadow: none;
      }
      button.menu-btn.secondary:hover {
        background: rgba(249, 115, 22, 0.1);
        border-color: var(--accent);
        box-shadow: none;
      }
      .join-row { display: flex; gap: 10px; }
      .join-row button { flex: 1; }
      #room-code {
        flex: 1;
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 17px;
        letter-spacing: 0.2em;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        text-transform: uppercase;
        width: 100px;
        transition: border-color 0.15s ease;
      }
      #room-code:focus { outline: none; border-color: var(--accent); }
      #mint-link {
        display: none;
        text-align: center;
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        padding-top: 4px;
      }
      #mint-link:hover { color: var(--accent-hover); text-decoration: underline; }
      #btn-spectate { flex: 0 0 auto; padding: 13px 14px; }
      #replay-link {
        text-align: center;
        color: var(--text-faint);
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
      }
      #replay-link:hover { color: var(--text); text-decoration: underline; }
      #pull-panel {
        display: none;
        position: relative;
        background: var(--panel);
        border: 1px solid var(--accent-soft);
        box-shadow: var(--panel-glow);
        backdrop-filter: blur(6px);
        border-radius: var(--radius-lg);
        padding: 16px;
        width: 250px;
        flex-direction: column;
        gap: 9px;
      }
      #pull-body {
        display: flex;
        flex-direction: column;
        gap: 9px;
        transition: transform 0.16s var(--ease), opacity 0.16s var(--ease);
      }
      #pull-body.switch-left { transform: translateX(-30px); opacity: 0; }
      #pull-body.switch-right { transform: translateX(30px); opacity: 0; }
      #pull-body.switch-instant { transition: none; }
      /* Pack-switcher arrows, riding the panel's side edges */
      .pull-arrow {
        display: none;
        position: absolute;
        top: 42%;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.75);
        color: var(--text-muted);
        font-size: 19px;
        line-height: 1;
        padding: 0 0 3px;
        cursor: pointer;
        z-index: 2;
        transition: color 0.15s ease, border-color 0.15s ease;
      }
      .pull-arrow:hover { color: var(--accent); border-color: var(--accent-soft); }
      #pull-prev { left: -13px; }
      #pull-next { right: -13px; }
      #pull-cover {
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface);
        display: none;
      }
      #pull-name {
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 16px;
        color: var(--text);
        text-align: center;
        min-height: 18px;
      }
      #pull-details {
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.55;
        text-align: center;
      }
      /* Phase + supply rows, styled after TigerMint's collection page. */
      .pull-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
      }
      #pull-phase {
        display: none;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: 6px;
        padding: 7px 10px;
      }
      #pull-phase .phase-name {
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 12px;
        color: var(--text);
      }
      #pull-phase .phase-price {
        margin-left: auto;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-muted);
      }
      #pull-phase .phase-live {
        background: var(--accent);
        color: #000;
        font-family: var(--font-display);
        font-size: 9px;
        letter-spacing: 0.05em;
        padding: 2px 7px;
        border-radius: 999px;
      }
      #pull-counts { display: none; justify-content: center; gap: 8px; }
      .pull-count {
        font-family: var(--font-mono);
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-muted);
        cursor: pointer;
        transition: border-color 0.15s ease, color 0.15s ease;
      }
      .pull-count:hover { border-color: var(--accent-soft); }
      .pull-count.active {
        background: var(--accent);
        border-color: var(--accent-press);
        color: var(--on-accent);
        font-weight: 700;
      }
      #pull-supply { display: none; flex-direction: column; gap: 5px; }
      #pull-supply .supply-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .supply-count {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted);
      }
      .supply-track {
        height: 4px;
        background: var(--surface);
        border-radius: 999px;
        overflow: hidden;
      }
      .supply-fill {
        height: 100%;
        width: 0;
        background: var(--accent);
        border-radius: 999px;
        transition: width 0.4s var(--ease);
      }
      #pull-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #pull-title {
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 15px;
        color: var(--accent);
      }
      #pull-hide {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        padding: 2px 6px;
      }
      #pull-hide:hover { color: var(--text); }
      #pull-status {
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.5;
        min-height: 18px;
        text-align: center;
      }
      #btn-pull, #btn-launch { font-size: 15px; padding: 10px; }
      #btn-pull:disabled, #btn-launch:disabled {
        background: var(--surface);
        color: var(--text-faint);
        box-shadow: none;
        cursor: default;
        transform: none;
      }
      #pull-reveal {
        display: none;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--accent);
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 12px;
        padding: 6px 14px;
        cursor: pointer;
      }
      #pull-reveal:hover { border-color: var(--accent-soft); }
      #room-banner {
        display: none;
        color: var(--accent);
        background: var(--panel);
        border: 1px solid var(--accent-soft);
        border-radius: var(--radius-sm);
        padding: 10px 18px;
        font-family: var(--font-mono);
        font-size: 15px;
      }
      #menu-error {
        display: none;
        color: var(--error);
        background: var(--panel);
        border: 1px solid rgba(248, 113, 113, 0.3);
        border-radius: var(--radius-sm);
        padding: 10px 18px;
        font-size: 14px;
        max-width: 420px;
        text-align: center;
      }

      /* --- Portrait / phone / Telegram Mini App: ONE-PAGE menu, with the
             pull panel as a bottom sheet behind a pulsing ▲ --- */
      #pull-sheet-toggle { display: none; }
      @keyframes sheet-nudge {
        0%, 100% { transform: translate(-50%, 0); }
        50% { transform: translate(-50%, -8px); }
      }
      @media (max-width: 820px) {
        /* ONE page, no scrolling: the banner stays visible up top and the
           compacted panel fills the rest. */
        #menu {
          justify-content: flex-start;
          overflow: hidden;
          padding: 0 0 44px; /* clear the ▲ glyph */
          gap: 8px;
        }
        #menu-row {
          flex-direction: column;
          align-items: center;
          gap: 8px;
          margin-top: min(28vh, 262px); /* below the canvas-drawn banner */
          width: 100%;
        }
        .panel {
          width: min(94vw, 440px);
          box-sizing: border-box;
          padding: 12px 16px;
          gap: 9px;
        }
        #deck-status { font-size: 12px; min-height: 0; line-height: 1.35; }
        #rules-preset { font-size: 14px; padding: 10px 12px; }
        #rules-desc { display: none; } /* the preset name says enough on a phone */
        button.menu-btn { font-size: 16px; padding: 12px; }
        #top-bar .menu-btn { font-size: 13px; padding: 9px 12px; }
        #room-code { font-size: 16px; padding: 10px; }
        #mint-link { font-size: 13px; padding-top: 0; }
        #replay-link { font-size: 12px; }

        /* The pull-card drawer: hidden below the screen, slid up by the ▲
           glyph, dismissed with the glowing ▼ handle. Tight and neat. */
        #pull-panel {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          width: auto;
          max-height: 88vh;
          overflow-y: auto;
          box-sizing: border-box;
          padding: 6px 16px calc(12px + env(safe-area-inset-bottom));
          border-radius: 22px 22px 0 0;
          border-bottom: none;
          gap: 7px;
          transform: translateY(105%);
          transition: transform 0.3s var(--ease);
          z-index: 45;
        }
        #pull-panel.sheet-open { transform: translateY(0); }
        #pull-body { gap: 7px; }
        #pull-cover { max-height: 32vh; }
        #pull-title { display: none; } /* the drawer speaks for itself */
        #pull-head { justify-content: center; }
        /* Glowing ▼ drawer handle (replaces the desktop ✕) */
        #pull-hide {
          font-size: 22px;
          line-height: 1;
          padding: 2px 44px 4px;
          color: var(--accent);
          text-shadow: 0 0 12px var(--accent), 0 0 26px var(--accent-soft);
        }
        #pull-name { font-size: 17px; min-height: 0; }
        #pull-details { font-size: 13px; line-height: 1.4; }
        #pull-status { font-size: 13px; min-height: 0; }
        #pull-phase { padding: 6px 10px; }
        #pull-phase .phase-name { font-size: 13px; }
        #pull-phase .phase-price { font-size: 13px; }
        .supply-count { font-size: 12px; }
        .pull-count { font-size: 14px; padding: 6px 16px; }

        /* The pull button rides the drawer's bottom edge while it scrolls. */
        #btn-pull {
          position: sticky;
          bottom: 0;
          font-size: 18px;
          padding: 15px;
          border-radius: var(--radius-lg);
          box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.65), var(--accent-glow);
        }

        /* Minimal glowing ▲ at the very bottom edge: summons the drawer. */
        #pull-reveal { display: none !important; }
        #pull-sheet-toggle {
          display: block;
          position: fixed;
          left: 50%;
          bottom: env(safe-area-inset-bottom);
          transform: translateX(-50%);
          padding: 0 44px 2px;
          background: none;
          border: none;
          color: var(--accent);
          font-size: 26px;
          line-height: 1.15;
          text-shadow: 0 0 12px var(--accent), 0 0 28px var(--accent-soft);
          cursor: pointer;
          z-index: 44;
          animation: sheet-nudge 1.6s var(--ease) infinite;
        }
        #room-banner, #menu-error { max-width: 94vw; font-size: 14px; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <div id="menu">
      <div id="menu-row">
        <div class="panel">
          <!-- Top row of the menu: deck builder + wallet connect -->
          <div id="top-bar">
            <button id="btn-deck" class="menu-btn secondary">🃏 Deck Builder</button>
            <button id="btn-mute" class="menu-btn secondary" title="Sound on/off">🔊</button>
            <div id="ton-connect"></div>
          </div>
          <div id="deck-status"></div>
          <select id="rules-preset"></select>
          <div id="rules-desc"></div>
          <button id="btn-ai" class="menu-btn">⚔ &nbsp;Play vs AI</button>
          <button id="btn-queue" class="menu-btn secondary">🎯 Find Opponent</button>
          <button id="btn-create" class="menu-btn secondary">Create PvP Room</button>
          <div class="join-row">
            <input id="room-code" placeholder="CODE" maxlength="4" />
            <button id="btn-join" class="menu-btn secondary">Join Room</button>
            <button id="btn-spectate" class="menu-btn secondary" title="Watch this room as a spectator">👁</button>
          </div>
          <a id="mint-link" href="#" target="_blank" rel="noopener">🐯 Mint your own card collection on TigerMint</a>
          <a id="replay-link" href="#">▶ Watch a replay</a>
          <input id="replay-file" type="file" accept=".json,application/json" style="display: none" />
        </div>

        <!-- Pull-a-card panel: live blind pulls when a TigerMint collection is
             configured, demo pulls otherwise -->
        <div id="pull-panel">
          <div id="pull-head">
            <span id="pull-title">🎴 Pull a card</span>
            <button id="pull-hide" title="Hide">×</button>
          </div>
          <!-- Everything that belongs to ONE pack lives in #pull-body, so
               switching packs can slide it out and back in as a unit. -->
          <div id="pull-body">
            <img id="pull-cover" alt="" />
            <div id="pull-name"></div>
            <div id="pull-details"></div>
            <div id="pull-phase"></div>
            <div id="pull-supply">
              <div class="supply-row">
                <span class="pull-label">Supply</span>
                <span class="supply-count" id="supply-count"></span>
              </div>
              <div class="supply-track"><div class="supply-fill" id="supply-fill"></div></div>
            </div>
            <!-- Booster size: ×1 / ×5 / ×10, capped by the drop's limits -->
            <div id="pull-counts"></div>
          </div>
          <div id="pull-status">Checking the drop…</div>
          <button id="btn-pull" class="menu-btn">Pull</button>
          <!-- Pack-switcher arrows; shown only with multiple collections -->
          <button id="pull-prev" class="pull-arrow" title="Previous pack">‹</button>
          <button id="pull-next" class="pull-arrow" title="Next pack">›</button>
        </div>

      </div>
      <button id="pull-reveal" title="Show the pull panel">🎴 Pull a card</button>
      <!-- Portrait only: pulses at the bottom edge and slides the pull
           panel up as a bottom sheet -->
      <button id="pull-sheet-toggle" title="Pull a card">▲</button>

      <div id="room-banner"></div>
      <div id="menu-error"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
